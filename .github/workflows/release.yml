name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compute version
        id: ver
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = $env:REF_NAME
          if ($v.Length -gt 0 -and ($v[0] -eq 'v' -or $v[0] -eq 'V')) { $v = $v.Substring(1) }
          if ($v -notmatch '^(0|[1-9]\d*)(\.(0|[1-9]\d*)){1,3}$') {
            throw "Tag invalido: '$env:REF_NAME'. Usa v<major>.<minor>[.<build>[.<revision>]]."
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Test
        shell: pwsh
        run: dotnet test tests/JevLauncher.Tests/JevLauncher.Tests.csproj -c Release
      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: Build ZIP and Setup
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./installer/build-all.ps1 -Version $env:VERSION `
            -Iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - name: Write checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $setup = "installer/dist/JevLauncher-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $setup -Leaf)" | Out-File -Encoding ascii "$setup.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            installer/dist/JevLauncher-Setup-*.exe
            installer/dist/JevLauncher-Setup-*.exe.sha256
            installer/dist/JevLauncher-*.zip

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem dist -Recurse -File | ForEach-Object { $_.FullName }
          if ($files.Count -lt 3) { throw "Faltan artefactos del release (esperaba >= 3, hay $($files.Count))." }
          gh release view $env:REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:REF_NAME @files --clobber
          } else {
            gh release create $env:REF_NAME @files --title $env:REF_NAME --generate-notes
          }
